<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка авторизации</title><style>body{font:16px system-ui;background:#850d25;padding:24px}main{max-width:480px;margin:auto;background:#fff8ef;padding:24px;border-radius:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border-radius:10px;border:1px solid #ccc}button{background:#173d33;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h2>Проверка связи сайта с API</h2><form id="f"><input id="email" type="email" required placeholder="Твоя электронная почта"><button id="b">Отправить код</button></form><pre id="out" role="status"></pre></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b'),out=document.getElementById('out');b.disabled=true;out.textContent='Отправляем запрос…';try{const r=await fetch('https://d5d5h5h6fube2lpctr6h.laqt4bj7.apigw.yandexcloud.net/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request_code',email:document.getElementById('email').value.trim()}),signal:AbortSignal.timeout(35000)});const j=await r.json();out.textContent=JSON.stringify({statusCode:r.status,success:j.success,message:j.message},null,2)}catch(e){out.textContent='Ошибка запроса: '+e.message}finally{b.disabled=false}};</script></html>
